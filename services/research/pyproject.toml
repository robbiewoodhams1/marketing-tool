[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "Research service for the marketing tool (foundation only)"
requires-python = ">=3.11"
dependencies = [
  "youtube-transcript-api>=1.2,<2",
  "postgrest>=2,<3",
  # Captions V1 (research.ffmpeg_engine's caption burn-in): renders caption
  # text to transparent PNG overlays, since no ffmpeg drawtext/libass build
  # is assumed to be available (see that module's docstring). >=10.1 for the
  # scalable ImageFont.load_default(size=...) bundled font, so no separate
  # font file needs to be installed/bundled.
  "pillow>=10.1,<13",
]

[project.scripts]
research = "research.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
